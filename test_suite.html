<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CanSat Tactical Suite - Automated Test Harness</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tactical_grid.css">
  <link rel="stylesheet" href="css/instruments.css">
  <style>
    body { background: #05080e; color: #fff; font-family: monospace; padding: 20px; }
    .test-pass { color: #00e676; font-weight: bold; }
    .test-fail { color: #ff1744; font-weight: bold; }
    .test-summary { font-size: 16px; margin-top: 20px; padding: 10px; border: 1px solid #00e5ff; }
  </style>
</head>
<body>
  <h2>=== CANSAT AUTOMATED TEST HARNESS ===</h2>
  <div id="test-results"></div>

  <!-- Hidden Mount Point for Components -->
  <div id="test-mount" style="position: absolute; left: -9999px; width: 1200px; height: 800px;">
    <div id="test-charts-container" style="width: 800px; height: 500px;"></div>
    <div id="test-raw-container" style="width: 800px; height: 300px;"></div>
    <div id="test-gauges-container" style="width: 800px; height: 400px;"></div>
  </div>

  <!-- Dependencies -->
  <script src="js/modules/attitude_math.js"></script>
  <script src="js/modules/telemetry_parser.js"></script>
  <script src="js/modules/physics_sitl.js"></script>
  <script src="js/components/charts_engine.js"></script>
  <script src="js/components/raw_table.js"></script>
  <script src="js/components/analog_gauges.js"></script>

  <script>
    const resultsDiv = document.getElementById('test-results');
    let passed = 0;
    let failed = 0;

    function assert(name, condition, details = '') {
      if (condition) {
        passed++;
        resultsDiv.innerHTML += `<div class="test-pass">✔ [PASS] ${name} ${details ? '(' + details + ')' : ''}</div>`;
      } else {
        failed++;
        resultsDiv.innerHTML += `<div class="test-fail">✖ [FAIL] ${name} ${details ? ': ' + details : ''}</div>`;
      }
    }

    try {
      // -------------------------------------------------------------
      // TEST 1: ChartsEngine Initialization & Plot Area Margins
      // -------------------------------------------------------------
      const container = document.getElementById('test-charts-container');
      const engine = new window.ChartsEngine(container);
      
      const plotArea = engine.getPlotArea(1000, 500, 1);
      assert('PlotArea Left Gutter', plotArea.left >= 48, `left margin = ${plotArea.left}px for Y-labels`);
      assert('PlotArea Bottom Gutter', plotArea.bottom >= 24, `bottom margin = ${plotArea.bottom}px for Time labels`);
      assert('PlotArea Dimensions Valid', plotArea.width > 800 && plotArea.height > 400, `${plotArea.width}x${plotArea.height}`);

      // -------------------------------------------------------------
      // TEST 2: Standby / Empty State at t=0 (Before Data)
      // -------------------------------------------------------------
      const emptyDomain = engine.computeTimeDomain([]);
      assert('Empty TimeDomain tMin', emptyDomain.tMin === 0, `tMin = ${emptyDomain.tMin}`);
      assert('Empty TimeDomain tMax', emptyDomain.tMax === 60, `tMax = ${emptyDomain.tMax}`);
      assert('Empty TimeDomain Live Origin', emptyDomain.isLiveOrigin === true);

      // Verify redrawAll does not throw on empty history
      let drawEmptyError = null;
      try {
        engine.redrawAll();
      } catch (err) {
        drawEmptyError = err.message;
      }
      assert('Redraw on Empty History (No Crash)', drawEmptyError === null, drawEmptyError || 'Clean render');

      // -------------------------------------------------------------
      // TEST 3: Point 0 Visibility at Launchpad (PAD, T=0, Alt=0.0m)
      // -------------------------------------------------------------
      const t0 = 1000.0;
      const p0 = {
        timestamp: t0,
        status: 'NOMINAL',
        sensors: {
          bmp280: { altitude_m: 0.0, pressure_hpa: 1013.25, temp_c: 15.0 },
          telemetry: { rssi_lora: -45, snr: 12.0, flight_phase: 'PAD' },
          imu: { accel_mps2: { x: 0, y: 0, z: 9.81 }, gyro_rads: { x: 0, y: 0, z: 0 } },
          kalman: { filteredAltitude_m: 0.0, filteredVelocity_mps: 0.0 }
        }
      };

      engine.addPoint(p0);
      assert('Point 0 Ingested', engine.history.length === 1);
      
      const visiblePointsAtT0 = engine.getVisiblePoints();
      assert('Point 0 Visible In Filter', visiblePointsAtT0.length === 1);
      assert('Point 0 Altitude Equals Zero', visiblePointsAtT0[0].altKalman === 0.0);

      const domainAtT0 = engine.computeTimeDomain(visiblePointsAtT0);
      assert('Domain at T0 Anchored to Start', domainAtT0.tMin === t0);
      assert('Domain at T0 Covers Time Window', domainAtT0.tMax === t0 + 60);
      assert('Domain at T0 isLiveOrigin', domainAtT0.isLiveOrigin === true);

      // Verify single point rendering does not crash and draws beacon
      let drawP0Error = null;
      try {
        engine.redrawAll();
      } catch (err) {
        drawP0Error = err.message;
      }
      assert('Point 0 Render (No Crash & Beacon Ready)', drawP0Error === null);

      // -------------------------------------------------------------
      // TEST 4: Progressive Time Advancement (t=0 to t=15s)
      // -------------------------------------------------------------
      for (let s = 1; s <= 15; s++) {
        engine.addPoint({
          timestamp: t0 + s,
          status: 'NOMINAL',
          sensors: {
            bmp280: { altitude_m: s * 10, pressure_hpa: 1013.25 - s, temp_c: 15.0 - s * 0.1 },
            telemetry: { rssi_lora: -50, snr: 11.5, flight_phase: 'ASCENT' },
            imu: { accel_mps2: { x: 0, y: 0, z: 19.6 }, gyro_rads: { x: 0, y: 0, z: 0.1 } },
            kalman: { filteredAltitude_m: s * 10, filteredVelocity_mps: 10.0 }
          }
        });
      }

      const visibleMidFlight = engine.getVisiblePoints();
      assert('Mid-Flight Point 0 Retained', visibleMidFlight[0].t === t0, `t0 retained in window`);
      assert('Mid-Flight Sample Count', visibleMidFlight.length === 16);
      
      const midDomain = engine.computeTimeDomain(visibleMidFlight);
      assert('Mid-Flight Origin Stays at Left', midDomain.isLiveOrigin === true);
      assert('Mid-Flight Left Margin Holds T0', midDomain.tMin === t0);

      // -------------------------------------------------------------
      // TEST 5: Reset Behavior
      // -------------------------------------------------------------
      engine.reset();
      assert('History Cleared on Reset', engine.history.length === 0);
      assert('Pill Alt Reset', engine.elements.pillAlt.textContent.includes('0.0m'));
      assert('Pill Vz Reset', engine.elements.pillVz.textContent.includes('+0.0m/s'));
      assert('Pill MaxAlt Reset', engine.elements.pillMaxAlt.textContent === '0.0m');

      // -------------------------------------------------------------
      // TEST 6: Channel Switching (All 4 Tactical Channels)
      // -------------------------------------------------------------
      const channels = ['PROFILE', 'KINEMATICS', 'ENVIRONMENT', 'RF_LINK'];
      let channelErrors = [];
      channels.forEach(ch => {
        try {
          engine.activeChannel = ch;
          engine.redrawAll();
        } catch (err) {
          channelErrors.push(`${ch}: ${err.message}`);
        }
      });
      assert('All 4 Channels Render Without Error', channelErrors.length === 0, channelErrors.join(', ') || 'All 4 Channels Nominal');

      // -------------------------------------------------------------
      // TEST 7: Raw Telemetry Component Ingest & Filtering
      // -------------------------------------------------------------
      const rawContainer = document.getElementById('test-raw-container');
      const rawTable = new window.RawTableComponent(rawContainer);
      rawTable.addPacket(p0);
      assert('Raw Table Ingest Packet', rawTable.rows.length === 1);
      assert('Raw Table TBody Row Rendered', rawTable.tbody.children.length === 1);

      // -------------------------------------------------------------
      // TEST 8: Low Altitude Visibility (0m - 130m) & Zero Canvas Overflow
      // -------------------------------------------------------------
      const testBox = container.querySelector('.chart-box');
      const testCanvas = container.querySelector('.chart-canvas');
      assert('Chart Box Container Exists', testBox !== null);
      assert('Chart Canvas Element Exists', testCanvas !== null);

      engine.resizeCanvases();
      assert('Canvas Has Explicit Style Width', testCanvas.style.width !== '');
      assert('Canvas Has Explicit Style Height', testCanvas.style.height !== '');

      const dpr = window.devicePixelRatio || 1;
      const plotAreaAlt = engine.getPlotArea(testCanvas.width, testCanvas.height, dpr);
      const zeroY = plotAreaAlt.top + plotAreaAlt.height;
      const zeroYCss = zeroY / dpr;
      const canvasHeightCss = parseFloat(testCanvas.style.height);

      assert('Zero Altitude Baseline Within Canvas Bounds', zeroYCss <= canvasHeightCss, `zeroY=${zeroYCss.toFixed(1)}px <= h=${canvasHeightCss}px`);
      assert('PlotArea Leaves Margin for Time Labels', (canvasHeightCss - zeroYCss) >= 20, `bottom margin = ${(canvasHeightCss - zeroYCss).toFixed(1)}px`);

      // Altitude 0 to 130m coordinates are well within plot area
      const maxAltScale = 950;
      const y0 = plotAreaAlt.top + plotAreaAlt.height - (0 / maxAltScale) * plotAreaAlt.height;
      const y130 = plotAreaAlt.top + plotAreaAlt.height - (130 / maxAltScale) * plotAreaAlt.height;
      assert('0m Altitude Coordinate In Canvas', y0 <= testCanvas.height);
      assert('130m Altitude Coordinate In Canvas', y130 >= plotAreaAlt.top && y130 < y0);
      assert('Altitude Delta 0-130m Has Distinct Vertical Span', (y0 - y130) > 15, `span = ${(y0 - y130).toFixed(1)}px`);

      // -------------------------------------------------------------
      // TEST 9: AnalogGaugesComponent Initialization & Structure
      // -------------------------------------------------------------
      const gaugesContainer = document.getElementById('test-gauges-container');
      const gauges = new window.AnalogGaugesComponent(gaugesContainer);
      assert('Analog Gauges Mounted', gaugesContainer.querySelector('.instruments-grid') !== null);
      assert('Altimeter Fast Needle Exists', gauges.elements.needleFast !== null);
      assert('Altimeter Slow Needle Exists', gauges.elements.needleSlow !== null);
      assert('Altimeter 10,000m Ten-K Needle Exists', gauges.elements.needleTenK !== null);
      assert('Altimeter Thousands Odometer Box Exists', gauges.elements.altKBox !== null);
      assert('Altimeter Thousands Odometer Val Exists', gauges.elements.altKVal !== null);
      assert('Variometer Half-Dial Needle Exists', gauges.elements.vspeedNeedle !== null);
      assert('Variometer Half-Dial Arc Exists', gauges.elements.vspeedArc !== null);
      assert('Barometer Half-Dial Needle Exists', gauges.elements.pressureNeedle !== null);
      assert('Temperature Half-Dial Needle Exists', gauges.elements.tempNeedle !== null);

      // -------------------------------------------------------------
      // TEST 10: Multi-Range Altimeter (>1000m) & Odometer Window
      // -------------------------------------------------------------
      // Case A: 1250 meters
      const packet1250 = {
        timestamp: 1050.0,
        status: 'NOMINAL',
        sensors: {
          bmp280: { altitude_m: 1250.0, pressure_hpa: 875.0, temp_c: 12.0 },
          telemetry: { rssi_lora: -65, snr: 9.5, flight_phase: 'ASCENSO' },
          imu: { accel_mps2: { x: 0, y: 0, z: 9.81 }, gyro_rads: { x: 0, y: 0, z: 0 } },
          kalman: { filteredAltitude_m: 1250.0, filteredVelocity_mps: 8.5 }
        }
      };
      gauges.update(packet1250, { maxAltitude_m: 1250.0, linkQuality: 'EXCELLENT', flightPhase: 'ASCENSO', descentRate_mps: 8.5 });

      assert('Altimeter Digital Altitude Matches', gauges.elements.altNum.textContent === '1250.0', gauges.elements.altNum.textContent);
      assert('Altimeter Odometer Shows 1 for 1250m', gauges.elements.altKVal.textContent === '1', `odometer = ${gauges.elements.altKVal.textContent}`);
      assert('Altimeter Odometer Highlights Active (>1000m)', gauges.elements.altKBox.classList.contains('active-high'));
      const getRotation = el => parseFloat(el.style.transform.replace(/[^\d.-]/g, ''));
      assert('Altimeter Ten-K Needle Rotates for 1250m', Math.abs(getRotation(gauges.elements.needleTenK) - 45) < 0.1, gauges.elements.needleTenK.style.transform);
      assert('Altimeter Fast Needle Rotates for 1250m', Math.abs(getRotation(gauges.elements.needleFast) - 180) < 0.1, gauges.elements.needleFast.style.transform);
      assert('Altimeter Slow Needle Rotates for 1250m', Math.abs(getRotation(gauges.elements.needleSlow) - 90) < 0.1, gauges.elements.needleSlow.style.transform);

      // Case B: 2750 meters
      const packet2750 = {
        timestamp: 1100.0,
        status: 'NOMINAL',
        sensors: {
          bmp280: { altitude_m: 2750.0, pressure_hpa: 730.0, temp_c: 5.0 },
          telemetry: { rssi_lora: -72, snr: 7.0, flight_phase: 'ASCENSO' },
          imu: { accel_mps2: { x: 0, y: 0, z: 9.81 }, gyro_rads: { x: 0, y: 0, z: 0 } },
          kalman: { filteredAltitude_m: 2750.0, filteredVelocity_mps: 12.0 }
        }
      };
      gauges.update(packet2750, { maxAltitude_m: 2750.0, linkQuality: 'EXCELLENT', flightPhase: 'ASCENSO', descentRate_mps: 12.0 });
      assert('Altimeter Odometer Shows 2 for 2750m', gauges.elements.altKVal.textContent === '2', `odometer = ${gauges.elements.altKVal.textContent}`);
      assert('Altimeter Ten-K Needle Rotates for 2750m', Math.abs(getRotation(gauges.elements.needleTenK) - 99) < 0.1, gauges.elements.needleTenK.style.transform);

      // Case C: 350 meters (< 1000m)
      const packet350 = {
        timestamp: 1020.0,
        status: 'NOMINAL',
        sensors: {
          bmp280: { altitude_m: 350.0, pressure_hpa: 970.0, temp_c: 18.0 },
          telemetry: { rssi_lora: -50, snr: 11.0, flight_phase: 'ASCENSO' },
          imu: { accel_mps2: { x: 0, y: 0, z: 9.81 }, gyro_rads: { x: 0, y: 0, z: 0 } },
          kalman: { filteredAltitude_m: 350.0, filteredVelocity_mps: 5.0 }
        }
      };
      gauges.update(packet350, { maxAltitude_m: 350.0, linkQuality: 'EXCELLENT', flightPhase: 'ASCENSO', descentRate_mps: 5.0 });
      assert('Altimeter Odometer Shows 0 for 350m', gauges.elements.altKVal.textContent === '0', `odometer = ${gauges.elements.altKVal.textContent}`);
      assert('Altimeter Odometer Inactive (<1000m)', !gauges.elements.altKBox.classList.contains('active-high'));

      // -------------------------------------------------------------
      // TEST 11: Half-Dial Gauges Response (Variometer, Baro, Temp)
      // -------------------------------------------------------------
      // Vz = 0 m/s -> Center needle (0 deg)
      const packetHover = {
        timestamp: 1150.0,
        status: 'NOMINAL',
        sensors: {
          bmp280: { altitude_m: 500.0, pressure_hpa: 955.0, temp_c: 20.0 },
          telemetry: { rssi_lora: -55, snr: 10.0, flight_phase: 'ESTACIONARIO' },
          imu: { accel_mps2: { x: 0, y: 0, z: 9.81 }, gyro_rads: { x: 0, y: 0, z: 0 } },
          kalman: { filteredAltitude_m: 500.0, filteredVelocity_mps: 0.0 }
        }
      };
      gauges.update(packetHover, { maxAltitude_m: 500.0, linkQuality: 'EXCELLENT', flightPhase: 'ESTACIONARIO', descentRate_mps: 0.0 });
      assert('Variometer Level Flight Zero Degrees', Math.abs(getRotation(gauges.elements.vspeedNeedle) - 0) < 0.1, gauges.elements.vspeedNeedle.style.transform);
      assert('Variometer Status Tag ESTABLE', gauges.elements.vspeedSubTag.textContent === 'ESTABLE');

      // Vz = -15 m/s -> Fast Descent Warning
      const packetDescent = {
        timestamp: 1200.0,
        status: 'NOMINAL',
        sensors: {
          bmp280: { altitude_m: 400.0, pressure_hpa: 965.0, temp_c: -5.0 },
          telemetry: { rssi_lora: -90, snr: 2.0, flight_phase: 'DESCENSO' },
          imu: { accel_mps2: { x: 0, y: 0, z: 9.81 }, gyro_rads: { x: 0, y: 0, z: 0 } },
          kalman: { filteredAltitude_m: 400.0, filteredVelocity_mps: -15.0 }
        }
      };
      gauges.update(packetDescent, { maxAltitude_m: 500.0, linkQuality: 'DEGRADED', flightPhase: 'DESCENSO', descentRate_mps: -15.0 });
      assert('Variometer Rapid Descent Status', gauges.elements.vspeedSubTag.textContent === 'CAÍDA RÁPIDA');
      assert('Variometer Rapid Descent Class Critical', gauges.elements.vspeedArc.getAttribute('class').includes('critical'));
      assert('Sub-Zero Temperature Arc Class Warning', gauges.elements.tempArc.getAttribute('class').includes('warning'));
      assert('RF Link Quality Badge Degraded', gauges.elements.rfStatus.textContent === 'DEGRADADO');

      // -------------------------------------------------------------
      // TEST 12: CanSat Telemetry Protocol (ASCII CSV & Formato 10 Campos)
      // -------------------------------------------------------------
      const parser = new window.TelemetryParser();
      const validCsv = '1024,00:00:15,15,48.5,22.4,3.95,0.02,-0.05,1.00,ASC_\n';
      const parsedCsv = parser.parse(validCsv);
      assert('CSV Ingest Success', parsedCsv.success === true, parsedCsv.error);
      assert('CSV TeamID 4 Digits Parsed', parsedCsv.packet.teamId === 1024, `teamId = ${parsedCsv.packet.teamId}`);
      assert('CSV Mission Time Parsed', parsedCsv.packet.missionTime === '00:00:15', `missionTime = ${parsedCsv.packet.missionTime}`);
      assert('CSV Packet Count Parsed', parsedCsv.packet.packetCount === 15, `packetCount = ${parsedCsv.packet.packetCount}`);
      assert('CSV Altitude Float 1 Dec', parsedCsv.packet.sensors.bmp280.altitude_m === 48.5, `alt = ${parsedCsv.packet.sensors.bmp280.altitude_m}`);
      assert('CSV Temperature Float 1 Dec', parsedCsv.packet.sensors.bmp280.temp_c === 22.4, `temp = ${parsedCsv.packet.sensors.bmp280.temp_c}`);
      assert('CSV Voltage Float 2 Dec', parsedCsv.packet.voltage === 3.95, `voltage = ${parsedCsv.packet.voltage}`);
      assert('CSV Accel_X Float 2 Dec', parsedCsv.packet.sensors.imu.accel_g.x === 0.02, `ax = ${parsedCsv.packet.sensors.imu.accel_g.x}`);
      assert('CSV Accel_Y Float 2 Dec', parsedCsv.packet.sensors.imu.accel_g.y === -0.05, `ay = ${parsedCsv.packet.sensors.imu.accel_g.y}`);
      assert('CSV Accel_Z Float 2 Dec', parsedCsv.packet.sensors.imu.accel_g.z === 1.00, `az = ${parsedCsv.packet.sensors.imu.accel_g.z}`);
      assert('CSV State 4 Characters', parsedCsv.packet.flightState === 'ASC_', `state = ${parsedCsv.packet.flightState}`);

      // Test formatCSV round-trip
      const formattedCsv = window.TelemetryParser.formatCSV(parsedCsv.packet);
      assert('formatCSV Output Matches CSV Pattern', formattedCsv.trim() === '1024,00:00:15,15,48.5,22.4,3.95,0.02,-0.05,1.00,ASC_', formattedCsv.trim());
      assert('formatCSV Terminates With Newline', formattedCsv.endsWith('\n'), 'Ends with \\n');

      // Test CSV Anomaly detection (bad fields)
      const badCsv = '1024,00:00:15,15,48.5,22.4\n'; // Only 5 fields
      const badResult = parser.parse(badCsv);
      assert('CSV Format Rejection on Field Count Mismatch', badResult.success === false, badResult.error);

      // -------------------------------------------------------------
      // TEST 13: Interfaz: Resolución Altímetro 0.5m & Rango Acelerómetro ±16g
      // -------------------------------------------------------------
      const altDial = gaugesContainer.querySelector('#altimeter-dial');
      assert('Altimeter Dial Face Exists', altDial !== null);
      const altTicks = altDial.querySelectorAll('line');
      assert('Altimeter Dial Features 200 Graduations (0.5m step over 100m)', altTicks.length === 200, `ticks count = ${altTicks.length}`);
      assert('Altimeter Face Displays RES: 0.5m Indicator', altDial.innerHTML.includes('RES: 0.5m'));
      assert('Altimeter Title Badge Specifies RES: 0.5m', gaugesContainer.querySelector('.gauge-title-badge').textContent.includes('RES: 0.5m'));

      engine.activeChannel = 'KINEMATICS';
      engine.updateTitles();
      assert('Kinematics Title Highlights +-16g Accelerometer Range', engine.elements.titlePrimary.textContent.includes('±16g'), engine.elements.titlePrimary.textContent);
      assert('Banner G-Force Cell Displays +-16g Label', gaugesContainer.querySelector('.flight-sub-label').textContent.includes('±16g'));

      // -------------------------------------------------------------
      // TEST 14: Valores Predeterminados CanSat (50m Dron, 500g Masa, 1Hz Telemetría)
      // -------------------------------------------------------------
      const testSitl = new window.PhysicsSITL();
      assert('SITL Launch Method Default is DRONE', testSitl.state.launchMethod === 'DRONE', testSitl.state.launchMethod);
      assert('SITL Target Apogee Default is 50m', testSitl.state.apogeeTarget_m === 50, `${testSitl.state.apogeeTarget_m}m`);
      assert('SITL Chute Deploy Alt Default is 35m', testSitl.state.chuteDeployAlt_m === 35, `${testSitl.state.chuteDeployAlt_m}m`);
      assert('SITL CanSat Mass Limit Default is 500g (0.500kg)', testSitl.CANSAT_MASS === 0.500, `${testSitl.CANSAT_MASS * 1000}g`);
      assert('SITL Telemetry Rate Default is 1Hz', testSitl.frequencyHz === 1, `${testSitl.frequencyHz} Hz`);

      const syntheticPkt = testSitl.generateSyntheticTelemetry();
      assert('Synthetic Packet Has TeamID 4 Digits', String(syntheticPkt.teamId).length === 4, `teamId = ${syntheticPkt.teamId}`);
      assert('Synthetic Packet Has Mission Time HH:MM:SS', /^\d{2}:\d{2}:\d{2}$/.test(syntheticPkt.missionTime), syntheticPkt.missionTime);
      assert('Synthetic Packet Has Packet Count Integer', Number.isInteger(syntheticPkt.packetCount));
      assert('Synthetic Packet Has Battery Voltage Float 2 Dec', typeof syntheticPkt.voltage === 'number' && syntheticPkt.voltage >= 3.3 && syntheticPkt.voltage <= 4.3, `${syntheticPkt.voltage}V`);
      assert('Synthetic Packet Has State String 4 Chars', syntheticPkt.flightState.length === 4, syntheticPkt.flightState);
      assert('Synthetic Packet Generates Valid ASCII CSV Line', syntheticPkt.rawCSV && syntheticPkt.rawCSV.endsWith('\n'), syntheticPkt.rawCSV);

    } catch (e) {
      assert('Test Execution Crash', false, e.message);
    }

    // Final Report Summary
    const total = passed + failed;
    resultsDiv.innerHTML += `
      <div class="test-summary">
        <strong>TOTAL TESTS: ${total} | PASADOS: <span class="test-pass">${passed}</span> | FALLADOS: <span class="test-fail">${failed}</span></strong>
        <div id="test-verdict" data-passed="${passed}" data-failed="${failed}" style="margin-top:5px; color:${failed === 0 ? '#00e676' : '#ff1744'};">
          ${failed === 0 ? '✓ TODOS LOS TESTS PASARON SATISFACTORIAMENTE' : '⚠ EXISTEN FALLOS EN EL BANCO DE PRUEBAS'}
        </div>
      </div>
    `;
  </script>
</body>
</html>
